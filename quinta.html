<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2024/25</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    .prossimamente-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    .prossimamente-orb {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, rgba(9,21,80,0.13) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: orbPulse 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes orbPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
      50%       { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
    }
    .prossimamente-label {
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--navy);
      font-weight: 500;
      opacity: 0.65;
      margin-bottom: 2rem;
      animation: fadeSlideUp 0.8s ease both;
    }
    .prossimamente-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 9vw, 7rem);
      font-weight: 700;
      color: var(--navy);
      line-height: 1.05;
      letter-spacing: -0.03em;
      animation: fadeSlideUp 0.9s 0.1s ease both;
    }
    .prossimamente-title em { font-style: italic; color: var(--black); }
    .prossimamente-sub {
      margin-top: 1.8rem;
      font-size: 1.05rem;
      color: rgba(0,0,0,0.6);
      max-width: 38ch;
      line-height: 1.7;
      animation: fadeSlideUp 1s 0.2s ease both;
    }
    .prossimamente-dots {
      display: flex;
      gap: 0.55rem;
      margin-top: 3rem;
      justify-content: center;
      animation: fadeSlideUp 1s 0.3s ease both;
    }
    .prossimamente-dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--navy);
      opacity: 0.25;
      animation: dotBlink 1.4s ease-in-out infinite;
    }
    .prossimamente-dots span:nth-child(2) { animation-delay: 0.2s; }
    .prossimamente-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBlink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(1); }
      40%            { opacity: 1;   transform: scale(1.3); }
    }
    .prossimamente-back {
      margin-top: 3.5rem;
      animation: fadeSlideUp 1s 0.4s ease both;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .prossimamente-ring {
      position: absolute;
      width: 340px; height: 340px;
      border-radius: 50%;
      border: 1.5px dashed rgba(9,21,80,0.18);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: ringSpin 18s linear infinite;
      pointer-events: none;
    }
    @keyframes ringSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .prossimamente-ring-outer {
      width: 460px; height: 460px;
      animation: ringSpinRev 28s linear infinite;
      border-color: rgba(9,21,80,0.09);
    }
    @keyframes ringSpinRev {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(-360deg); }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo">Portfolio.</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="terza.html">Terza</a>
      <a href="quarta.html">Quarta</a>
      <a href="quinta.html" class="active">Quinta</a>
    </div>
    <div class="nav-contact">
      <a href="mailto:email@example.com" class="btn-pill">Contattami</a>
    </div>
    <button class="hamburger" onclick="toggleMenu()">&#9776;</button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" onclick="toggleMenu()">Home</a>
    <a href="terza.html" onclick="toggleMenu()">Terza</a>
    <a href="quarta.html" onclick="toggleMenu()">Quarta</a>
    <a href="quinta.html" onclick="toggleMenu()">Quinta</a>
  </div>

  <div class="prossimamente-wrap">
    <div class="prossimamente-ring"></div>
    <div class="prossimamente-ring prossimamente-ring-outer"></div>
    <div class="prossimamente-orb"></div>
    <div class="prossimamente-label">Anno Scolastico 2026/27</div>
    <h1 class="prossimamente-title">Classe<br><em>Quinta.</em></h1>
    <p class="prossimamente-sub">Torna l'anno prossimo.</p>
    <div class="prossimamente-dots">
      <span></span><span></span><span></span>
    </div>
    <div class="prossimamente-back">
      <a href="quarta.html" class="btn-outline">← Classe Quarta</a>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-left">© 2025 — Tutti i diritti riservati</div>
    <div class="footer-right">
      <a href="#">LinkedIn</a>
      <a href="#">Instagram</a>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
